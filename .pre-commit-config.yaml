repos:
  - repo: local
    hooks:
      - id: gofumpt
        name: gofumpt
        entry: bash -c 'out=$(gofumpt -l "$@"); if [ -n "$out" ]; then echo "$out"; echo "Run gofumpt -w on the listed files."; exit 1; fi' --
        language: golang
        additional_dependencies: [mvdan.cc/gofumpt@v0.9.2]
        types_or: [go]

      - id: eslint
        name: eslint (typescript/javascript)
        entry: npm --prefix web run lint
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./cmd/... ./internal/... ./migrations/... ./monitoring/...
        language: system
        files: \.go$
        pass_filenames: false
